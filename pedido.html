<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Acompanhar pedido | Agência Winc</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/personalizacao.css"></head><body><main class="container admin-page"><a class="brand" href="/"><img class="brand-logo" src="/assets/logo-winc-web.webp" alt="Agência Winc"></a><section class="admin-login" style="margin-top:3rem"><span class="section-label">Acompanhamento</span><h1>Seu pedido</h1><div id="order-view"><p>Carregando pedido…</p></div></section></main><script>const params=new URLSearchParams(location.search),id=params.get('order'),token=params.get('token');const labels={awaiting_payment:'Aguardando pagamento',in_review:'Pagamento em análise',approved:'Pagamento aprovado',rejected:'Pagamento recusado',awaiting_art:'Aguardando envio da arte',art_review:'Arte em análise',awaiting_approval:'Aguardando aprovação',in_production:'Em produção',ready_for_pickup:'Pronto para retirada',shipped:'Enviado',delivered:'Entregue',cancelled:'Cancelado',refunded:'Reembolsado'};fetch('/.netlify/functions/store/orders/'+encodeURIComponent(id||'')+'?token='+encodeURIComponent(token||'')).then(r=>r.json().then(d=>({ok:r.ok,d}))).then(({ok,d})=>{document.querySelector('#order-view').innerHTML=ok?`<h2>${d.id}</h2><p>Pagamento: <strong>${labels[d.financialStatus]||d.financialStatus}</strong></p><p>Produção: <strong>${labels[d.productionStatus]||d.productionStatus}</strong></p><p>Total: <strong>${new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(d.total)}</strong></p>`:`<p>${d.error}</p>`}).catch(()=>document.querySelector('#order-view').innerHTML='<p>Não foi possível consultar o pedido.</p>')</script></body></html>
